# Niches shown in the Streamlit "Niche" dropdown. Add your own by copying a block.
# Fields:
#   keywords            generic search terms (Hacker News, Stack Exchange, fallback for others)
#   github_keywords     GitHub issue search terms (feature requests)
#   stackexchange_sites api_site_parameter values (softwarerecs, webapps, superuser, money, ...)
#   app_store_terms     App Store search terms; low-star reviews of the top apps are mined
#   youtube_terms       YouTube video searches; comments are mined
#   social_keywords     Bluesky search terms
#   cfpb_terms          US consumer-finance complaint searches (finance niches only)
#   github_min_reactions minimum reactions on a GitHub issue (default 5)

niches:
  - id: developer_tools
    label: Developer tools & DevOps
    keywords: [CI pipeline, code review, API testing, logging, deployment, database migration, local development, monorepo]
    github_keywords: [CLI, integration, export, plugin, automation, dashboard]
    github_min_reactions: 10
    stackexchange_sites: [softwarerecs, superuser, devops, softwareengineering]
    app_store_terms: [ssh terminal, git client, api client]
    youtube_terms: [github actions tutorial, docker tutorial, vscode extensions]
    social_keywords: [devtools, CI pipeline, developer experience]

  - id: productivity_automation
    label: Productivity & workflow automation
    keywords: [spreadsheet, automate, excel, google sheets, email, calendar, note taking, copy paste]
    github_keywords: [automation, sync, import csv, calendar, export]
