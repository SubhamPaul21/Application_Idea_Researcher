[project]
name = "idea-miner"
version = "0.1.0"
description = "Mine real-world problems from legal, public sources and turn them into ranked app ideas and PRD specs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.38",
    "typer>=0.12",
    "anthropic>=0.70",
    "openai>=1.40",
]

[project.optional-dependencies]
# Better clustering quality (multilingual, handles Hinglish). Pulls in PyTorch (~2 GB).
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
idea-miner = "idea_miner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_miner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
